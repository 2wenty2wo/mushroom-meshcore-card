name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload bundle to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/mushroom-meshcore-card.js
          # Tags containing a hyphen (e.g. v1.0.0-beta) are treated as
          # prereleases per semver convention. Stable tags (v1.0.0) keep
          # the action's default `make_latest: legacy`, which lets GitHub
          # promote them to Latest by date+semver.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Deliberately not setting `name` or `body`: when the release
          # was pre-created with `gh release create --title --notes ...`
          # those values are preserved instead of being overwritten with
          # generic auto-text.
