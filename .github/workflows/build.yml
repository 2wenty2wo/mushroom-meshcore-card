name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate release tag and versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const tag = process.env.RELEASE_TAG ?? "";
          const version = tag.startsWith("v") ? tag.slice(1) : "";
          const semver =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
          const match = semver.exec(version);
          const invalidNumericPrerelease = match?.[4]
            ?.split(".")
            .some(
              (identifier) =>
                /^\d+$/.test(identifier) &&
                identifier.length > 1 &&
                identifier.startsWith("0"),
            );
          const packageData = JSON.parse(
            readFileSync("package.json", "utf8"),
          );
          const lockData = JSON.parse(
            readFileSync("package-lock.json", "utf8"),
          );
          const packageVersion = packageData.version;
          const errors = [];

          if (!match || invalidNumericPrerelease) {
            errors.push(
              "Release tags must use full SemVer, for example v0.16.0 or v0.16.0-beta.1.",
            );
          }
          if (tag !== "v" + packageVersion) {
            errors.push(
              "Tag " + tag + " does not match package.json version " + packageVersion + ".",
            );
          }

          for (const [source, lockedVersion] of [
            ["package-lock.json", lockData.version],
            ['package-lock.json packages[""]', lockData.packages?.[""]?.version],
          ]) {
            if (
              typeof lockedVersion !== "string" ||
              lockedVersion !== packageVersion
            ) {
              errors.push(
                source +
                  " version " +
                  String(lockedVersion) +
                  " does not match package.json version " +
                  packageVersion +
                  ".",
              );
            }
          }

          if (errors.length > 0) {
            for (const error of errors) {
              console.error("::error::" + error);
            }
            process.exit(1);
          }

          const prerelease = match[4] !== undefined;
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            "prerelease=" + String(prerelease) + "\n",
          );
          console.log(
            "Validated " +
              tag +
              " (prerelease: " +
              String(prerelease) +
              ").",
          );
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check translations
        run: npm run check-translations

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify HACS bundle
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync } from "node:fs";

          const expected = "mushroom-meshcore-card.js";
          const entries = readdirSync("dist", { withFileTypes: true });
          const bundle = "dist/" + expected;

          if (
            entries.length !== 1 ||
            !entries[0].isFile() ||
            entries[0].name !== expected
          ) {
            console.error(
              "::error::dist must contain only " +
                expected +
                "; found: " +
                entries.map((entry) => entry.name).join(", "),
            );
            process.exit(1);
          }
          if (statSync(bundle).size === 0) {
            console.error("::error::" + bundle + " is empty.");
            process.exit(1);
          }
          NODE

      - name: Run render tests
        run: npm run test:render

      - name: Find or create release draft
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_list="$(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | [.tag_name, .draft] | @tsv'
          )"
          match_count=0
          was_draft="true"

          while IFS=$'\t' read -r release_tag release_draft; do
            if [[ "${release_tag}" == "${TAG}" ]]; then
              match_count=$((match_count + 1))
              was_draft="${release_draft}"
            fi
          done <<< "${release_list}"

          if (( match_count > 1 )); then
            echo "::error::Multiple releases use tag ${TAG}; resolve the duplicate drafts manually."
            exit 1
          fi

          if (( match_count == 0 )); then
            create_args=(
              --repo "${GITHUB_REPOSITORY}"
              --verify-tag
              --draft
              --generate-notes
            )
            if [[ "${PRERELEASE}" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${TAG}" "${create_args[@]}"
            echo "Created generated-notes draft for ${TAG}."
          else
            echo "Reusing existing release for ${TAG} (draft: ${was_draft})."
          fi

          echo "was_draft=${was_draft}" >> "${GITHUB_OUTPUT}"

      - name: Upload bundle to release
        id: upload
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/mushroom-meshcore-card.js
          draft: ${{ steps.release.outputs.was_draft }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          overwrite_files: true
          fail_on_unmatched_files: true
          # Do not set name, body, body_path, or generate_release_notes.
          # Existing curated text is preserved, and missing-release notes
          # were generated exactly once in the preceding step.

      - name: Verify uploaded HACS asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: |
          set -euo pipefail

          valid_asset_count="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq '[.assets[] | select(.name == "mushroom-meshcore-card.js" and .size > 0)] | length'
          )"
          if [[ "${valid_asset_count}" != "1" ]]; then
            echo "::error::Expected one non-empty mushroom-meshcore-card.js release asset."
            exit 1
          fi

      - name: Publish release draft
        if: steps.release.outputs.was_draft == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: |
          set -euo pipefail

          if [[ "${PRERELEASE}" == "true" ]]; then
            make_latest="false"
          else
            make_latest="legacy"
          fi
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest="${make_latest}" \
            --silent
